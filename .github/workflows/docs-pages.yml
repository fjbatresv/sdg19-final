name: Docs (Starlight + Compodoc)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Use npm 11.6.2
        run: npm i -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Generate Compodoc and enforce coverage
        run: npx nx run web:docs:check

      - name: Patch Compodoc base href for GitHub Pages
        run: COMPODOC_BASE_PATH=/${{ github.event.repository.name }}/compodoc/ node tools/compodoc/patch-base.js

      - name: Generate TypeDoc and OpenAPI
        run: npm run docs:check

      - name: Build Starlight site
        env:
          ASTRO_BASE: /${{ github.event.repository.name }}/
        run: npm run docs:build

      - name: Assemble GitHub Pages site
        run: |
          mkdir -p dist/gh-pages/compodoc dist/gh-pages/api-typedoc
          cp -R dist/docs-site/. dist/gh-pages/
          cp -R dist/compodoc/web/. dist/gh-pages/compodoc/
          cp -R docs/api-typedoc/. dist/gh-pages/api-typedoc/

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/gh-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
