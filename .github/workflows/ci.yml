name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_CLOUD: 'false'
  NX_DAEMON: 'false'
  NX_ISOLATE_PLUGINS: 'false'

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Audit dependencies (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Lint, test, build, typecheck
        run: npx nx run-many -t lint test build typecheck

      - name: Docs check
        run: npx nx run docs:check
